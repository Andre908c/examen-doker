<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de productos</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Registro de productos</h1>
      <p class="subtitle">Los datos se guardan en MySQL, base de datos <strong>mydb</strong>.</p>

      <form id="form-producto">
        <label>
          Nombre del producto
          <input type="text" name="nombre" required maxlength="120" />
        </label>
        <label>
          Categoría
          <input type="text" name="categoria" required maxlength="80" />
        </label>
        <label>
          Precio
          <input type="number" name="precio" required min="0" step="0.01" />
        </label>
        <button type="submit">Guardar</button>
      </form>

      <p id="mensaje" class="mensaje" hidden></p>

      <h2>Productos guardados</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Precio</th>
          </tr>
        </thead>
        <tbody id="tabla-productos"></tbody>
      </table>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
